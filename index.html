<!DOCTYPE html>
<html lang="en">

<head>

  <title>Tea House</title>
  <link rel="stylesheet" href="styles/style.css">
  <script src="https://kit.fontawesome.com/29ad1f12eb.js" crossorigin="anonymous"></script>
